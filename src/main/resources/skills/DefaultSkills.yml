#示例: 旅行者之弓增加失明效果, 展示新 Potion 函数
逐日之弓:
  Cooldown: 5.0
  Lore: "逐日之弓"
  CooldownTip: ActionBar{p=&a技能冷却时间;s=&a%.2fs;empty=&f|;full=&a|;length=75}
  Skills:
    - action: "Blink"
      distance: "120"
      trigger: "onHit:ARROW"
      target: "Location"
    - action: "Potion"
      type: "BLINDNESS"
      duration: "3"
      level: "1"
      trigger: "onHit:ARROW"
      target: "Entity"
    - action: "Reward"
      then:
        action: "Chat"
        m: "&7箭失明效果已触发"
      trigger: "onHit:ARROW"
