精准时运切换:
  Lore: §2Shift+右键切换模式(精准/时运)
  Cooldown: 4.0
  CooldownTip: ActionBar{p=&c切换冷却时间;s=&a%.2fs;empty=&f|;full=&c|;length=75}
  Skills:
    - Switch{s=精准;时运} ~onShiftUse

# 精准模式: 收起时运(等级记入物品, 切回时原样恢复), 挂上精准
精准:
  Skills:
    - RewardSwitch{Enchant{name=LOOT_BONUS_BLOCKS;level=0}}
    - RewardSwitch{Enchant{name=SILK_TOUCH;level=restore}}
    - RewardSwitch{ActionBar{m=&b&l切换为精准模式}}

# 时运模式: 收起精准, 恢复之前的时运等级
时运:
  Skills:
    - RewardSwitch{Enchant{name=SILK_TOUCH;level=0}}
    - RewardSwitch{Enchant{name=LOOT_BONUS_BLOCKS;level=restore}}
    - RewardSwitch{ActionBar{m=&a&l切换为时运模式}}

