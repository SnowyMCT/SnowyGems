# 兼容配置：保留旧 ID、Lore 标记和效果，避免改变旧物品。
# 新默认玩法见 ArtisanGem.yml、ExpeditionRune.yml 与 ExpeditionSkills.yml。
向前闪现:
  Cooldown: 10.0
  Lore: "右键即可闪现"
  CooldownTip: ActionBar{p=&f闪现冷却时间;s=&a%.2fs;empty=&f|;full=&a|;length=75}
  Skills:
    - action: "Blink"
      distance: "$LORE:闪现距离?32$"
      trigger: "onUse"
      target: "Forward"

飞雷神三叉戟:
  Cooldown: 15.0
  Lore: "飞雷神三叉戟"
  CooldownTip: ActionBar{p=&a技能冷却时间;s=&a%.2fs;empty=&f|;full=&a|;length=75}
  Skills:
    - action: "Blink"
      distance: "120"
      trigger: "onTridentHit"
      target: "Location"
    - action: "Reward"
      then:
        action: "Title"
        m: "&e飞雷神之术"
      trigger: "onTridentHit"

跳跃之蛋:
  Cooldown: 5.0
  Lore: "扔出此蛋, 你将瞬移到落点"
  Slot:
    - mainhand
  CooldownTip: ActionBar{p=&a技能冷却时间;s=&a%.2fs;empty=&f|;full=&a|;length=75}
  Skills:
    - action: "Blink"
      distance: "120"
      trigger: "onHit:EGG"
      target: "Location"
    - action: "Reward"
      then:
        action: "Chat"
        m: "&e跳跃之蛋!"
      trigger: "onHit:EGG"

精准时运切换:
  Lore: §2Shift+右键切换模式(精准/时运)
  Cooldown: 4.0
  CooldownTip: ActionBar{p=&c切换冷却时间;s=&a%.2fs;empty=&f|;full=&c|;length=75}
  Skills:
    - action: Switch
      from: "精准"
      to: "时运"
      trigger: onShiftUse

# 精准模式: 收起时运(等级记入物品, 切回时原样恢复), 挂上精准
精准:
  Skills:
    - action: "RewardSwitch"
      then:
        action: "Enchant"
        name: "LOOT_BONUS_BLOCKS"
        level: "0"
    - action: "RewardSwitch"
      then:
        action: "Enchant"
        name: "SILK_TOUCH"
        level: "restore"
    - action: "RewardSwitch"
      then:
        action: "ActionBar"
        m: "&b&l切换为精准模式"

# 时运模式: 收起精准, 恢复之前的时运等级
时运:
  Skills:
    - action: "RewardSwitch"
      then:
        action: "Enchant"
        name: "SILK_TOUCH"
        level: "0"
    - action: "RewardSwitch"
      then:
        action: "Enchant"
        name: "LOOT_BONUS_BLOCKS"
        level: "restore"
    - action: "RewardSwitch"
      then:
        action: "ActionBar"
        m: "&a&l切换为时运模式"

