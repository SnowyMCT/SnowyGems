# ============================================================
#  多版本示例技能
# ============================================================
#  这个文件演示两件事:
#    1. 新技能引擎能怎么用 —— 条件、概率、延迟、组合、循环
#    2. 高版本才有的内容怎么写 —— 直接写就行, 低版本会自动跳过并在控制台说明
#
#     ️ 本文件里的技能只是示例, 默认不会被任何物品触发(需要物品 Lore 里有对应标记)
#     可以直接照抄改成自己的技能
#
#  ── 写法速查 ────────────────────────────────────────────
#    函数清单     /sgem skills
#    触发标记     /sgem triggers
#    版本能力     /sgem compat
#
#  ── 每个技能定义的字段 ──────────────────────────────────
#    Lore         物品 lore 里出现这段文字, 就会绑定这个技能(去色比较, 可含颜色码)
#    Cooldown     冷却秒数, 不写或 0 表示无冷却
#    CooldownTip  冷却中的提示, 本身也是一个函数表达式
#    Skills       技能行列表, 每行格式: 函数名{参数} ~触发标记 @作用目标
#
#  ── 作用目标 @ ──────────────────────────────────────────
#    @Self      (默认) 作用于自己
#    @Entity    作用于被攻击/被命中的实体
#    @Location  作用于命中坐标(闪现、粒子、闪电常用)
#
#  ── 动态取值 ────────────────────────────────────────────
#    $LORE:标签?默认值$   从物品 lore 里读数值, 例:
#      Blink{distance=$LORE:闪现距离?32$}
#      装备上写 "闪现距离 64" 就用 64, 没写就用 32
# ============================================================


# ── 1. 条件技能: 濒死时自动保命 ─────────────────────────────
# If 的条件变量: health(生命比例0~1) / raw_health / food / level / y / target_health
濒死守护:
  Lore: "&c濒死守护"
  Cooldown: 30.0
  CooldownTip: ActionBar{p=&c守护冷却;s=&c%.2fs;empty=&8|;full=&c|;length=40}
  Skills:
    # 被打到 30% 以下时, 回血 + 抗性 + 击退周围
    - If{c=health<0.3;All{Heal{amount=20};Potion{type=RESISTANCE;level=3;duration=6};Sound{name=ITEM_TOTEM_USE}}} ~onDamaged
    - If{c=health<0.3;Title{m=&c&l守护发动;s=&7生命已恢复}} ~onDamaged


# ── 2. 概率技能: 攻击时几率触发额外效果 ─────────────────────
雷霆之刃:
  Lore: "&b雷霆之刃"
  Skills:
    # 20% 概率召唤闪电 + 30% 概率点燃
    - Chance{p=0.2;Lightning{damage=true}} ~onAttack @Entity
    - Chance{p=0.3;Fire{ticks=80}} ~onAttack @Entity
    - Chance{p=0.2;ActionBar{m=&e&l雷霆!}} ~onAttack


# ── 3. 连招: 延迟与重复 ─────────────────────────────────────
# Delay 延迟若干 tick, Repeat 按间隔重复 —— 组合起来可以做持续伤害/多段攻击
三段斩:
  Lore: "&6三段斩"
  Cooldown: 8.0
  Skills:
    - Repeat{times=3;interval=6;All{Damage{amount=4};Particle{name=SWEEP_ATTACK;count=8}}} ~onAttack @Entity
    - Sound{name=ENTITY_PLAYER_ATTACK_SWEEP} ~onAttack


# ── 4. 击杀与挖掘触发 ───────────────────────────────────────
猎手之证:
  Lore: "&2猎手之证"
  Skills:
    # 击杀回血
    - Heal{amount=4} ~onKill
    - ActionBar{m=&a猎杀回复 &f4 &a生命} ~onKill

矿工之友:
  Lore: "&e矿工之友"
  Skills:
    # 挖矿 10% 概率给急迫, 让连续挖掘更顺
    - Chance{p=0.1;Potion{type=HASTE;level=2;duration=8}} ~onBreak
    # 5% 概率不消耗耐久(直接把耐久修回来 1 点)
    - Chance{p=0.05;Repair{amount=1}} ~onDamaged


# ── 5. 位移: 冲刺与击飞 ─────────────────────────────────────
疾风步:
  Lore: "&b疾风步"
  Cooldown: 6.0
  CooldownTip: ActionBar{p=&b疾风冷却;s=&b%.2fs;empty=&8|;full=&b|;length=40}
  Skills:
    - Velocity{forward=1.8;up=0.35} ~onShiftUse
    - Particle{name=CLOUD;count=30} ~onShiftUse
    - Sound{name=ENTITY_ENDER_DRAGON_FLAP;pitch=1.6} ~onShiftUse

# 击飞对手: 给受害者一个向上的速度
上挑:
  Lore: "&6上挑"
  Cooldown: 5.0
  Skills:
    - Velocity{up=0.9} ~onAttack @Entity
    - Sound{name=ENTITY_PLAYER_ATTACK_KNOCKBACK} ~onAttack


# ============================================================
#  以下是「高版本才有」的示例
#  低版本服务端上这些行会被自动跳过, 控制台会说明缺什么, 其余技能照常工作
#  用 /sgem compat 看自己的版本支持哪些
# ============================================================

# ── 6. 1.21+ 试炼密室药水效果 ───────────────────────────────
# oozing(渗浆) / infested(寄生) / weaving(盘丝) / wind_charged(蓄风)
试炼之刃:
  Lore: "&5试炼之刃"
  Cooldown: 10.0
  Skills:
    # 命中给对手挂上试炼系负面效果 —— 1.21 以下会跳过这三行
    - Potion{type=oozing;duration=6;level=1} ~onAttack @Entity
    - Potion{type=weaving;duration=6;level=1} ~onAttack @Entity
    - Potion{type=infested;duration=6;level=1} ~onAttack @Entity
    - ActionBar{m=&5试炼诅咒已施加} ~onAttack

# 蓄风: 打人时给自己叠蓄风, 配合风爆附魔
蓄风战锤:
  # 1.21 才有锤(MACE), 所以这个技能的物品本身就需要 1.21+
  Lore: "&3蓄风战锤"
  Cooldown: 4.0
  Skills:
    - Potion{type=wind_charged;duration=10;level=1} ~onAttack
    - Chance{p=0.35;All{Velocity{up=0.6};Sound{name=ENTITY_WIND_CHARGE_WIND_BURST}}} ~onAttack


# ── 7. 1.21.11+ 矛(SPEAR) ───────────────────────────────────
# 矛可以投掷, 因此 ~onLaunch:SPEAR 与 ~onHit:SPEAR 都能用
# 类型名直接来自服务端实体注册表, 引擎不需要"认识"矛这个概念
穿云长矛:
  Lore: "&f穿云长矛"
  Cooldown: 6.0
  CooldownTip: ActionBar{p=&f长矛冷却;s=&f%.2fs;empty=&8|;full=&f|;length=40}
  Skills:
    # 投出瞬间的反馈
    - Sound{name=ITEM_TRIDENT_THROW} ~onLaunch:SPEAR
    - ActionBar{m=&f长矛已投出} ~onLaunch:SPEAR
    # 命中处爆发 + 传送到落点(类似飞雷神)
    - Particle{name=EXPLOSION;count=1} ~onHit:SPEAR @Location
    - Damage{amount=6} ~onHit:SPEAR @Entity
    - Blink{distance=120} ~onHit:SPEAR @Location


# ── 8. 1.20.5+ / 1.21.2+ 新属性(用 Attribute 奖励, 不是技能函数) ──
# 属性是「镶嵌到装备上的永久加成」, 属于宝石的 Rewards, 不是技能
# 这里只做说明, 实际写法在 gems 目录的宝石配置里:
#
#   Rewards:
#     # 1.20.5+ 体型缩放, 0.9 = 缩小到九成
#     - Attribute{name=scale;operation=0;slot=any;var=v-0.1;limit=-0.3}
#     # 1.20.5+ 方块交互距离 +1 格
#     - Attribute{name=block_interaction_range;operation=0;slot=hand;var=v+1;limit=3}
#     # 1.21.2+ 水下挖掘速度(默认水下挖掘慢 5 倍, 加满等于不受影响)
#     - Attribute{name=submerged_mining_speed;operation=0;slot=hand;var=v+0.2;limit=1}
#     # 1.21.2+ 挖掘效率
#     - Attribute{name=mining_efficiency;operation=0;slot=hand;var=v+0.5;limit=3}
#
# slot 可写: head/chest/legs/feet/hand/off_hand/any_hand/armor/any/auto
#   any/armor/any_hand 是 1.20.5+ 的槽位组语义, 老版本会退化成主手


# ── 9. 形态切换: 引擎自动反推当前形态 ───────────────────────
# 只要两个形态各自用 RewardSwitch{Enchant{...;level=restore}} 声明自己的特征附魔,
# 引擎就能在物品没有状态标记时(旧物品/手动加的 Lore)判断出当前处于哪个形态
# 因此你新增任意一组切换都不需要改代码
#
# 下面是一个第三组的例子: 火焰附加 ↔ 击退
火焰击退切换:
  Lore: "&6Shift+右键切换(火焰/击退)"
  Cooldown: 4.0
  CooldownTip: ActionBar{p=&6切换冷却;s=&6%.2fs;empty=&8|;full=&6|;length=40}
  Skills:
    - Switch{s=火焰形态;击退形态} ~onShiftUse

火焰形态:
  Skills:
    - RewardSwitch{Enchant{name=knockback;level=0}}
    - RewardSwitch{Enchant{name=fire_aspect;level=restore}}
    - RewardSwitch{ActionBar{m=&6&l切换为火焰形态}}

击退形态:
  Skills:
    - RewardSwitch{Enchant{name=fire_aspect;level=0}}
    - RewardSwitch{Enchant{name=knockback;level=restore}}
    - RewardSwitch{ActionBar{m=&f&l切换为击退形态}}
