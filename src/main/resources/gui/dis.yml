# /sgem open 宝石拆卸台 的专属界面。首次启动释放，已有文件不会覆盖；修改后 /sgem reload。
# 每行必须 9 个字符。E 恰好一个装备槽；G 可重复，是宝石列表与翻页区域。
# 想让界面文字随语言变化, 值写成 lang:键名(见 lang/*.yml 里「拆卸台界面」一节);
# 也可以直接写文本(例如 Display: '&b装备槽') —— 两种写法都支持。
宝石拆卸台:
  Permission: snowygems.dismantle
  Title: 'lang:dismantle-gui-title'
  Slots:
    - TTTTTTTTT
    - TTQTTGGGT
    - TTETTGGGT
    - TTQTTGGGT
    - TTTTTGGGT
    - TXTTTPNTT
  Items:
    T:
      Type: FILLER
      Material: BLACK_STAINED_GLASS_PANE
      Display: ' '
    Q:
      Type: TIP
      Material: LIGHT_BLUE_STAINED_GLASS_PANE
      Display: 'lang:dismantle-gui-equip-slot'
      Tips: ['lang:dismantle-gui-equip-slot-tips']
    E:
      Type: EQUIP_SLOT
    G:
      Type: GEM_LIST
      Material: AUTO
      Display: '{gem}'
      Tips: ['lang:dismantle-gui-gem-tips']
    P:
      Type: PAGE_PREV
      Material: ARROW
      Display: 'lang:dismantle-gui-page-prev'
      Tips: ['lang:dismantle-gui-page-tips']
    N:
      Type: PAGE_NEXT
      Material: ARROW
      Display: 'lang:dismantle-gui-page-next'
      Tips: ['lang:dismantle-gui-page-tips']
    X:
      Type: CLOSE
      Material: BARRIER
      Display: 'lang:dismantle-gui-close'
