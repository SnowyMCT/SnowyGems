# /sgem editor 的独立外观配置；/sgem reload 后生效。
# Material 使用 Bukkit/XMaterial 名称；未知材质会回退到内置图标。
# Display 与 Tips 可用 {name} 引用图标原文；标题可用 {id}、{category}、{group}、{index}。
# 界面文字写 lang:键名 就随语言变化(见 lang/*.yml); 也可以直接写文本, 两种都支持。
Titles:
  Home: 'lang:editor-title-home'
  CategoriesGem: 'lang:editor-title-categories-gem'
  CategoriesRune: 'lang:editor-title-categories-rune'
  Entries: 'lang:editor-title-entries'
  Detail: 'lang:editor-title-detail'
  Fields: 'lang:editor-title-fields'
  Move: 'lang:editor-title-move'
  Actions: 'lang:editor-title-actions'
  ChooseAction: 'lang:editor-title-choose-action'
  ActionDetail: 'lang:editor-title-action-detail'
  Pool: 'lang:editor-title-pool'
  ChoosePool: 'lang:editor-title-choose-pool'
  Ingredients: 'lang:editor-title-ingredients'
  ChooseIngredient: 'lang:editor-title-choose-ingredient'
  Confirm: 'lang:editor-title-confirm'
  Input: 'lang:editor-title-input'

# 六行列表页的位置。不要与下面四个导航按钮重叠。
ContentSlots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
Slots:
  Back: 45
  Previous: 48
  Add: 49
  Next: 50
  HomeGem: 11
  HomeRune: 15
  HomeHelp: 22
  DetailSummary: 4
  DetailBack: 27
  DetailMove: 29
  DetailFields: 31
  DetailDelete: 35
  ConfirmYes: 11
  ConfirmInfo: 13
  ConfirmNo: 15

Icons:
  Border:
    Material: BLACK_STAINED_GLASS_PANE
    Display: ' '
  Back:
    Material: ARROW
    Display: '{name}'
  Add:
    Material: LIME_DYE
    Display: '{name}'
  Previous:
    Material: ARROW
    Display: 'lang:editor-icon-previous'
  PreviousDisabled:
    Material: GRAY_STAINED_GLASS_PANE
    Display: 'lang:editor-icon-previous-disabled'
  Next:
    Material: ARROW
    Display: 'lang:editor-icon-next'
  NextDisabled:
    Material: GRAY_STAINED_GLASS_PANE
    Display: 'lang:editor-icon-next-disabled'
  HomeGem:
    Material: DIAMOND
    Display: 'lang:editor-icon-home-gem'
    Tips: ['lang:editor-icon-home-gem-tips']
  HomeRune:
    Material: SMITHING_TABLE
    Display: 'lang:editor-icon-home-rune'
    Tips: ['lang:editor-icon-home-rune-tips']
  HomeHelp:
    Material: BOOK
    Display: 'lang:editor-icon-home-help'
    Tips: ['lang:editor-icon-home-help-tips']
  CategoryGem:
    Material: CHEST
    Display: 'lang:editor-icon-category-gem'
    Tips: ['lang:editor-icon-category-gem-tips']
  CategoryRune:
    Material: BOOKSHELF
    Display: 'lang:editor-icon-category-rune'
    Tips: ['lang:editor-icon-category-rune-tips']
  EntryGem:
    Display: '{name}'
  EntryRune:
    Material: ENCHANTED_BOOK
    Display: '{name}'
  MoveCategory:
    Material: CHEST
  GroupBasic:
    Material: WRITABLE_BOOK
  GroupAppearance:
    Material: PAINTING
  GroupLimit:
    Material: IRON_CHESTPLATE
  GroupRewards:
    Material: ENCHANTED_BOOK
  GroupPool:
    Material: ENDER_CHEST
  GroupIngredients:
    Material: CHEST
  DetailSummary:
    Display: '{name}'
  DetailMove:
    Material: HOPPER
  DetailFields:
    Material: BOOK
  DetailDelete:
    Material: BARRIER
  Field:
    Display: '{name}'
  Action:
    Material: ENCHANTED_BOOK
  ActionChoice:
    Display: '{name}'
  ActionField:
    Material: PAPER
  PoolEntry:
    Material: ENDER_EYE
  IngredientEntry:
    Material: DIAMOND
  Selection:
    Material: DIAMOND
  ConfirmYes:
    Material: LIME_CONCRETE
  ConfirmInfo:
    Material: PAPER
  ConfirmNo:
    Material: RED_CONCRETE
  InputText:
    Material: PAPER
  InputCancel:
    Material: BARRIER
  InputSave:
    Material: EMERALD
