# Dismantles an unused example rune, not a rune already embedded in equipment.
# Use /sgem dismantle to remove an embedded gem from equipment.
# 界面文字写 lang:键名 就随语言变化(见 lang/*.yml)。
符文分解台:
  Title: 'lang:gui-runedsm-title'
  Slots:
    - TTTTTTTTT
    - TGTTBTTIT
    - TQTTBTFXT
  Items:
    T:
      Type: TIP
      Material: BLACK_STAINED_GLASS_PANE
      Display: ' '
    I:
      Type: TIP
      Material: ENCHANTED_BOOK
      Display: 'lang:gui-runedsm-info-display'
      Tips: ['lang:gui-runedsm-info-tips']
    B:
      Type: USE_GEM
      Material: GRINDSTONE
      Glow: true
      Display: 'lang:gui-runedsm-use-display'
      Tips: ['lang:gui-runedsm-use-tips']
      Gem: 符文分解券
    G:
      Type: EQUIP_SLOT
      Require:
        - GEM:红色符文I
        - GEM:蓝色符文I
        - GEM:绿色符文I
        - GEM:技能符文I
    Q:
      Type: PAGE_JUMP
      Material: ENCHANTING_TABLE
      Display: 'lang:gui-runedsm-back-display'
      Gui: 符文镶嵌台
    X:
      Type: CLOSE
      Material: BARRIER
      Display: 'lang:gui-runedsm-close-display'
    F:
      Type: RUNE_FORGE
      Material: SMITHING_TABLE
      Display: 'lang:gui-runedsm-forge-display'
