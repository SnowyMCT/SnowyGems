# Existing server files are preserved on upgrade. Copy the desired menu below into
# plugins/SnowyGems/gui/gui.yml to adopt the new preview and navigation buttons.
# 界面文字写 lang:键名 就随语言变化(见 lang/*.yml); 也可以直接写文本, 两种都支持。
default:
  Title: 'lang:gui-bench-title'
  Slots:
    - TETBTATTT
    - TITGTCTXT
    - TTTTTTTTT
  Items:
    T:
      Type: TIP
      Material: BLACK_STAINED_GLASS_PANE
      Display: ' '
    E:
      Type: TIP
      Material: IRON_CHESTPLATE
      Display: 'lang:gui-bench-equip-display'
      Tips: ['lang:gui-bench-equip-tips']
    B:
      Type: TIP
      Material: DIAMOND
      Display: 'lang:gui-bench-gem-display'
    A:
      Type: TIP
      Material: BOOK
      Display: 'lang:gui-bench-preview-display'
    I:
      Type: EQUIP_SLOT
    G:
      Type: GEM_SLOT
      Amount: 1
    C:
      Type: CONFIRM_EMBED
      Material: ANVIL
      Tips: ['lang:gui-bench-confirm-tips']
    X:
      Type: CLOSE
      Material: BARRIER
      Display: 'lang:gui-bench-close-display'

符文镶嵌台:
  Title: 'lang:gui-rune-title'
  Slots:
    - TTTTITTTT
    - TbTTgTTrT
    - TBTTGTTRT
    - TTTTsTTTT
    - TTTTSTTTT
    - TQTTCTFXT
  Items:
    T:
      Type: TIP
      Material: BLACK_STAINED_GLASS_PANE
      Display: 'lang:gui-rune-hint-display'
      Tips: ['lang:gui-rune-hint-tips']
    b:
      Type: TIP
      Material: BLUE_STAINED_GLASS_PANE
      Display: 'lang:gui-rune-blue-display'
    g:
      Type: TIP
      Material: GREEN_STAINED_GLASS_PANE
      Display: 'lang:gui-rune-green-display'
    r:
      Type: TIP
      Material: RED_STAINED_GLASS_PANE
      Display: 'lang:gui-rune-red-display'
    s:
      Type: TIP
      Material: YELLOW_STAINED_GLASS_PANE
      Display: 'lang:gui-rune-skill-display'
    I:
      Type: EQUIP_SLOT
      Require: [WEAPON, TOOL, ARMOR]
    B:
      Type: GEM_SLOT
      Require: 蓝色符文
      Amount: 1
    G:
      Type: GEM_SLOT
      Require: 绿色符文
      Amount: 1
    R:
      Type: GEM_SLOT
      Require: 红色符文
      Amount: 1
    S:
      Type: GEM_SLOT
      Require: 技能符文
      Amount: 1
    C:
      Type: CONFIRM_EMBED
      Material: ANVIL
      Glow: true
      Tips: ['lang:gui-rune-confirm-tips']
    Q:
      Type: PAGE_JUMP
      Material: GRINDSTONE
      Display: 'lang:gui-rune-jump-display'
      Tips: ['lang:gui-rune-jump-tips']
      Gui: 符文分解台
    F:
      Type: RUNE_FORGE
      Material: SMITHING_TABLE
      Display: 'lang:gui-rune-forge-display'
      Tips: ['lang:gui-rune-forge-tips']
    X:
      Type: CLOSE
      Material: BARRIER
      Display: 'lang:gui-rune-close-display'
