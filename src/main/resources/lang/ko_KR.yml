# ============================================================
#  SnowyGems 언어 파일 - 한국어 (ko_KR)
# ============================================================
#  이 폴더(lang/)의 각 파일은 하나의 언어이며, 파일 이름이 곧
#  언어 코드입니다:
#    zh_CN.yml - 중국어 간체 (기본값)
#    en_US.yml - 영어
#  서버 언어는 config.yml 의 "Lang" 노드로 설정합니다.
#  변경 후 /sgem reload 를 실행하면 즉시 적용되며,
#  서버를 재시작할 필요가 없습니다.
#
#  이 파일들은 TabooLib 언어 모듈이 관리합니다:
#    - 첫 실행 시 플러그인 폴더(lang/)에 자동 배포됩니다
#    - 플러그인 업데이트로 추가된 새 노드는 병합되며, 수정한 내용은 유지됩니다
#
#  ── 키(Keys) ──────────────────────────────────────────────
#    평면 구조만 사용합니다(중첩 없음). 계층은 대시로 연결합니다:
#      예전 lang.yml 의 gem.embed-success  ->  여기서는 gem-embed-success
#    코드에서는 두 표기 모두 동작하며, 점(.) 표기는 자동으로 변환됩니다.
#
#  ── 색상(Colors) ──────────────────────────────────────────
#    &0-&9 &a-&f  색상    &l 굵게  &o 기울임  &n 밑줄
#    &m 취소선  &k 난독화  &r 초기화
#
#  ── 플레이스홀더(Placeholders) ────────────────────────────
#    {xxx}  이름 있는 플레이스홀더로, 실제 값으로 치환됩니다.
#           각 메시지 아래 주석에 해당 플레이스홀더가 나열됩니다.
#
#  ── 전송 방식(Send prefix) ────────────────────────────────
#    (없음)        일반 채팅 메시지
#    actionbar:    단축바(hotbar) 위의 액션바
#    title:        큰 타이틀 (메인/서브타이틀은 | 로 구분)
#    none:         아무것도 보내지 않음 (해당 메시지 비활성화)
#
#  ── 접두사(Prefix) ────────────────────────────────────────
#    "prefix" 는 명령어 응답 메시지(command.* 섹션 참고) 앞에
#    자동으로 붙습니다.
# ============================================================

