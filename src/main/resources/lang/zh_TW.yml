embed-not-gem: '&c寶石槽裡的物品不是本外掛的寶石'
embed-gem-missing: '&c寶石配置不存在: &f{gem}'
embed-wrong-type: '&c這類寶石請直接手持右鍵使用, 不需要鑲嵌'
embed-wrong-gui: '&c該寶石需要在 &f{gui} &c中使用'
embed-equip-is-gem: '&c裝備槽裡放的是寶石, 請放入要被強化的裝備'
embed-out-of-scope: '&c這件裝備不在該寶石的適用範圍內 &7(需要: &f{scope}&7)'
# 中間確認按鈕的外觀
