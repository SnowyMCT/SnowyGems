dismantle-need-held: '&c請先手持要拆卸寶石的裝備'
dismantle-no-embed: '&7這件裝備上沒有可拆卸的寶石'
# 每個寶石圖示下方的說明  佔位符見各行
dismantle-cost-line: '&7拆卸費用: &e{amount} &7{type}'     # {amount} 數額  {type} 金幣/點券/經驗等級
dismantle-break-line: '&c有 &e{chance}&c% 機率損壞寶石(不返還)'  # {chance} 損壞機率
dismantle-click-hint: '&a點選拆卸此寶石'
