# ============================================================
#  SnowyGems 語言檔案 - 繁體中文 (zh_TW)
# ============================================================
#  本目錄(lang/)下的每個檔案對應一種語言, 檔名即語言代碼:
#    zh_CN.yml - 簡體中文 (預設)
#    en_US.yml - English
#    zh_TW.yml - 繁體中文
#  伺服器當前使用的語言在 config.yml 的 Lang 節點設定,
#  修改後執行 /sgem reload 立即生效, 無需重啟伺服器。
#
#  這些檔案由 TabooLib 語言模組託管:
#    - 首次執行自動釋放到外掛目錄 lang/ 資料夾
#    - 直接修改外掛目錄裡的檔案也會被熱重載(自動生效)
#    - 外掛更新後新增的節點會自動補進已釋放的檔案, 不覆蓋已改過的行
#
#  ── 鍵名 ──────────────────────────────────────────────────
#    語言檔案必須是扁平結構(不支援巢狀), 層級用橫槓連接:
#      舊版 lang.yml 的 gem.embed-success  -> 本檔案寫 gem-embed-success
#    程式碼裡兩種寫法都能用, 舊點號寫法會自動轉換。
#
#  ── 顏色 ────────────────────────────────────────────────
#    &0-&9 &a-&f  顏色      &l 粗體  &o 斜體  &n 底線
#    &m 刪除線    &k 亂碼    &r 重置
#
#  ── 佔位符 ──────────────────────────────────────────────
#    {xxx}  具名佔位符, 會被對應的實際值替換。每條訊息下方註釋裡
#           標註了這條訊息可用的佔位符, 不寫也不會報錯(原樣保留)
#
#  ── 發送方式前綴 ────────────────────────────────────────
#    在文本最前面加下列前綴, 可以改變這句話的呈現方式:
#      (無前綴)      普通聊天欄訊息
#      actionbar:    顯示在物品欄上方的動作欄
#      title:        大標題 (用 | 分隔主標題和副標題)
#      none:         什麼都不發 (等於關掉這條提示)
#    例:
#      gem-embed-success: "actionbar:&a鑲嵌成功!"
#      gem-embed-success: "title:&a鑲嵌成功!|&7裝備已強化"
#      gem-embed-success: "none:"
#
#  ── 前綴 ────────────────────────────────────────────────
#    prefix 會自動加在「命令回覆類」訊息前面(見 command.* 一節)
#    其餘提示不帶前綴, 以免洗頻
# ============================================================

# 外掛訊息前綴
prefix: '&8[&bSnowyGems&8] &f'

# ── 通用 ──────────────────────────────────────────────────
# 翻頁按鈕
common-next-page: '&a下一頁 &7→'
common-next-page-none: '&7已經是最後一頁了'
common-prev-page: '&7← &a上一頁'
common-prev-page-none: '&7已經是第一頁了'
# 數值/佔位
common-any-item: '任意物品'
# /sgem debug 裡表示"不過濾任何 tag"
common-scope-all: '全部'
# GUI 通用返回按鈕
common-back: '&e← 返回'

# ── /sgem 命令回執 (這一節的訊息會自動帶上 prefix) ─────────
# 配置重新載入完成  佔位符: {time} 耗時毫秒
command-reload: '&a配置已重新載入 &7({time}ms)'
# /sgem use 時手上沒拿東西
command-no-held-gem: '&c請先手持要使用的寶石'
# 目標玩家不在線  佔位符: {player}
command-no-player: '&c玩家不在線: &f{player}'
# 寶石 ID 不存在  佔位符: {gem}
command-no-gem: '&c未知的寶石配置: &f{gem}'
# 給予成功  佔位符: {player} {gem} {amount}
command-give: '&a已給予 &f{player} &7×&f{amount} &a個 &f{gem}'
# 除錯開關
command-debug-on: '&a除錯模式已臨時開啟, 輸出範圍: &f{scope} &7(重新載入後以 config.yml 為準)'
command-debug-off: '&7除錯模式已臨時關閉'
command-debug-scope: '&a除錯輸出範圍已設為: &f{scope}'
command-debug-scope-all: '&a除錯輸出範圍已設為: &f全部'
# 鑲嵌臺設定
command-no-air: '&c空氣不能被設定為鑲嵌臺'
command-no-block: '&c準星處無方塊...'
command-has-been-dug-up: '&e設定的鑲嵌臺方塊已被挖掘, 後續在該位置放置的方塊點選將不會開啟鑲嵌臺'
command-block-not-allowed: '&c該方塊不被允許設定為鑲嵌臺, 請聯絡管理員'
command-block-marbed: '&e該方塊已標記, 正在覆蓋'

# ── 寶石核心邏輯 (鑲嵌 / 使用 / 拆除) ─────────────────────
