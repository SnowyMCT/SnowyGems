# ── 工作臺選單 (gui.yml / rune.yml 定義的介面) ────────────
# 選單名字寫錯了  佔位符: {menu}
menu-not-found: '&c選單不存在: &f{menu}'
# Shift 移入時沒有能接收該物品的空槽
menu-no-slot: '&c沒有可以放入該物品的空槽位'
# 裝備槽裡有裝備, 但所有寶石槽都是空的
menu-select-gem: '&7請先把寶石放進寶石槽, 或拿起一顆寶石再點選裝備'
