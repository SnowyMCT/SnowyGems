dismantle-broke: '&c很遺憾, {gem} &c在拆卸時損壞了, 未能返還'
# 費用不足  佔位符: {amount} {type}
dismantle-not-afford: '&c拆卸需要 &e{amount} &f{type}&c, 你的餘額不足'
# 手持物品在開啟介面後發生了變化
