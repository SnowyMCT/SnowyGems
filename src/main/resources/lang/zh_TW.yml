# 物品帶著寶石標記, 但配置檔案裡已經找不到這個 ID 了
gem-config-missing: '&c寶石配置不存在, 請聯絡管理員'
# 裝備不在 Require 允許的範圍內
gem-require-failed: '&c該裝備不滿足此寶石的適用範圍'
# 機率判定成功, 但所有 Rewards 都沒真正生效(通常是配置裡的附魔/屬性名過期)
gem-no-effect: '&c鑲嵌未生效...'
# 鑲嵌結果 (寶石配置裡寫了 SuccessTip / FailTip 時以配置為準)
gem-embed-success: '&a鑲嵌成功! 裝備已強化'
gem-embed-fail: '&c很遺憾, 強化失敗了'
# GUI 按鈕類寶石(USE_GEM)的執行結果
gem-button-success: '&a操作成功'
gem-button-fail: '&c操作失敗'
# 直接右鍵使用類寶石
gem-use-success: '&a使用成功!'
gem-use-fail: '&c使用失敗!'
gem-need-workbench: '&c該寶石需要在工作臺中鑲嵌到裝備上使用'
# 隨機獎池  佔位符: {gem} 抽中的寶石名
gem-random-get: '&a獲得了 &f{gem}'
gem-pool-empty: '&c該隨機獎池是空的, 請聯絡管理員'
gem-pool-invalid: '&c隨機獎池裡引用了不存在的寶石, 請聯絡管理員'
# 拆除
gem-remove-success: '&a已拆除該寶石'
# 防誤用保護: 寶石不能當方塊放置 / 塞展示框
gem-protect-place: '&c寶石不能放置到世界裡, 否則會失效'
# 防誤用保護: 寶石不可食用
gem-protect-eat: '&c寶石不可食用'

# ── 獎勵通用提示 (兌換券等直接給玩家資源的寶石) ───────────
