# ── 技能 / BUFF ───────────────────────────────────────────
# 技能定義裡沒寫 CooldownTip 時用的兜底提示  佔位符: {time} 剩餘秒數
skill-cooldown: '&c技能冷卻中: &f{time}s'
# CooldownTip 寫成 Chat{} / Title{} 但沒給 m 參數時的兜底文本
skill-cooldown-chat: '&c技能冷卻中'
skill-cooldown-title: '&c冷卻中'
# 形態切換  佔位符: {mode} 切換後的形態名
skill-switch: '&7已切換形態: &f{mode}'

# ── 版本更新檢測 & 公告 ────────────────────────────────────
# 伺服器啟動後靜默檢測一次, 結果列印到控制台; 管理員上線也會收到
# 想改顏色/措辭改這裡即可, 全部支援 &顏色碼 與 title:/actionbar:/none: 前綴
# 控制台: 本地版本與官方不一致(不做大小比較, 只要 ≠ 遠端就提示)  佔位符: {current} 當前版本  {latest} 官方版本  {date} 發布日期
update-console-available: '&e[SnowyGems] &f當前版本 &7{current} &f與官方 &a{latest} &7({date})&f 不一致, 請前往更新~'
# 控制台: 與官方一致  佔位符: {current}
update-console-latest: '&8[SnowyGems] &7當前版本 &f{current} &7已是官方最新'
# 控制台: 無法獲取官方版本(網路/代理問題, 常見於伺服器直連 GitHub 超時; 此時不代表已是最新)
update-console-failed: '&c[SnowyGems] &f無法獲取官方版本號, 請檢查網路/代理(不代表已是最新)'
# 管理員上線: 本地版本與官方不一致  佔位符: {current} {latest} {date}
update-player-available: '&e[SnowyGems] &f當前版本 &7{current} &f與官方 &a{latest} &7({date})&f 不一致, 請前往更新~'
# 公告展示的頭尾裝飾(公告正文來自遠端 ann.txt, 每行原樣顯示)
update-announce-header: '&b&m        &r &b&l公告 &b&m        '
update-announce-footer: '&b&m                                '

