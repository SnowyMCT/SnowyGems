# ── /sgem triggers reference ───────────────────────────────
# Documentation only; editing this does not change the engine.
# Each line is rendered as-is; add/remove/reword freely.
triggers-divider: '&8&m                                                  '
triggers-title: '&bTrigger marks &7(at the end of a skill line, e.g. &f~onUse&7)'
triggers-list:
  - '  &a~onUse &8- &7right-click use'
  - '  &a~onShiftUse &8- &7sneak + right-click'
  - '  &a~onSwing &8- &7left-click swing'
  - '  &a~onShiftSwing &8- &7sneak + left-click (trident/spear works too)'
  - '  &a~onAttack &8- &7melee attack hits an entity'
  - '  &a~onKill &8- &7kill an entity'
  - '  &a~onHit &8- &7projectile hits (any type)'
  - '  &a~onHit:type &8- &7projectile hits a specific type, e.g. onHit:ARROW / onHit:TRIDENT / onHit:SPEAR'
  - '  &a~onLaunch &8- &7projectile launched (any type)'
  - '  &a~onLaunch:type &8- &7projectile of a specific type launched'
  - '  &a~onBreak &8- &7break a block'
  - '  &a~onDamaged &8- &7item about to lose durability'
  - '  &a~onTimer &8- &7poll every second (for permanent BUFFs)'
triggers-footer: '&8Skill functions: &f/sgem skills  &8version capabilities: &f/sgem compat'
