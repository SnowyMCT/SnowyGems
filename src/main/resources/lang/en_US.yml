# ============================================================
#  SnowyGems Language File - English (en_US)
# ============================================================
#  Each file in this folder (lang/) is one language; the file
#  name is the language code:
#    zh_CN.yml - Simplified Chinese (default)
#    en_US.yml - English
#  The server language is set via the "Lang" node in config.yml.
#  Run /sgem reload after changing it - takes effect immediately,
#  no server restart needed.
#
#  These files are managed by the TabooLib language module:
#    - Released automatically to the plugin folder (lang/) on first run
#    - New nodes added by plugin updates are merged in, keeping edits
#
#  ── Keys ──────────────────────────────────────────────────
#    Flat structure only (no nesting); levels joined with dashes:
#      old lang.yml gem.embed-success  ->  gem-embed-success here
#    Both spellings work in code; dotted keys are converted automatically.
#
#  ── Colors ────────────────────────────────────────────────
#    &0-&9 &a-&f  colors    &l bold  &o italic  &n underline
#    &m strikethrough  &k obfuscated  &r reset
#
#  ── Placeholders ──────────────────────────────────────────
#    {xxx}  named placeholder, replaced by the actual value.
#           The comment under each message lists its placeholders.
#
#  ── Send prefix ───────────────────────────────────────────
#    (no prefix)   normal chat message
#    actionbar:    action bar above the hotbar
#    title:        big title (separate main/subtitle with |)
#    none:         send nothing (disables the message)
#
#  ── Prefix ────────────────────────────────────────────────
#    "prefix" is prepended automatically to command-reply
#    messages (see command.* section)
# ============================================================

