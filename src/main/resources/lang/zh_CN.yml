gem-pool-invalid: '&c随机奖池里引用了不存在的宝石, 请联系管理员'
# 拆除
gem-remove-success: '&a已拆除该宝石'
# 防误用保护: 宝石不能当方块放置 / 塞展示框
gem-protect-place: '&c宝石不能放置到世界里, 否则会失效'
# 防误用保护: 宝石不可食用
gem-protect-eat: '&c宝石不可食用'

