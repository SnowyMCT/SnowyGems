# ============================================================
#  SnowyGems 语言文件 - 简体中文 (zh_CN)
# ============================================================
#  本目录(lang/)下的每个文件对应一种语言, 文件名即语言代码:
#    zh_CN.yml - 简体中文 (默认)
#    en_US.yml - English
#  服务器当前使用的语言在 config.yml 的 Lang 节点设置,
#  修改后执行 /sgem reload 立即生效, 无需重启服务器。
#
#  这些文件由 TabooLib 语言模块托管:
#    - 首次运行自动释放到插件目录 lang/ 文件夹
#    - 直接修改插件目录里的文件也会被热重载(自动生效)
#    - 插件更新后新增的节点会自动补进已释放的文件, 不覆盖已改过的行
#
#  ── 键名 ──────────────────────────────────────────────────
#    语言文件必须是扁平结构(不支持嵌套), 层级用横杠连接:
#      旧版 lang.yml 的 gem.embed-success  -> 本文件写 gem-embed-success
#    代码里两种写法都能用, 旧点号写法会自动转换。
#
#  ── 颜色 ────────────────────────────────────────────────
#    &0-&9 &a-&f  颜色      &l 粗体  &o 斜体  &n 下划线
#    &m 删除线    &k 乱码    &r 重置
#
#  ── 占位符 ──────────────────────────────────────────────
#    {xxx}  具名占位符, 会被对应的实际值替换。每条消息下方注释里
#           标注了这条消息可用的占位符, 不写也不会报错(原样保留)
#
#  ── 发送方式前缀 ────────────────────────────────────────
#    在文本最前面加下列前缀, 可以改变这句话的呈现方式:
#      (无前缀)      普通聊天栏消息
#      actionbar:    显示在物品栏上方的动作栏
#      title:        大标题 (用 | 分隔主标题和副标题)
#      none:         什么都不发 (等于关掉这条提示)
#    例:
#      gem-embed-success: "actionbar:&a镶嵌成功!"
#      gem-embed-success: "title:&a镶嵌成功!|&7装备已强化"
#      gem-embed-success: "none:"
#
#  ── 前缀 ────────────────────────────────────────────────
#    prefix 会自动加在「命令回执类」消息前面(见 command.* 一节)
#    其余提示不带前缀, 以免刷屏
# ============================================================

# 插件消息前缀
prefix: '&8[&bSnowyGems&8] &f'

# ── 通用 ──────────────────────────────────────────────────
# 翻页按钮
common-next-page: '&a下一页 &7→'
common-next-page-none: '&7已经是最后一页了'
common-prev-page: '&7← &a上一页'
common-prev-page-none: '&7已经是第一页了'
# 数值/占位
common-any-item: '任意物品'
# /sgem debug 里表示"不过滤任何 tag"
common-scope-all: '全部'
# GUI 通用返回按钮
common-back: '&e← 返回'

# ── /sgem 命令回执 (这一节的消息会自动带上 prefix) ─────────
# 配置重载完成  占位符: {time} 耗时毫秒
command-reload: '&a配置已重新加载 &7({time}ms)'
# /sgem use 时手上没拿东西
command-no-held-gem: '&c请先手持要使用的宝石'
# 目标玩家不在线  占位符: {player}
command-no-player: '&c玩家不在线: &f{player}'
# 宝石 ID 不存在  占位符: {gem}
command-no-gem: '&c未知的宝石配置: &f{gem}'
# 给予成功  占位符: {player} {gem} {amount}
command-give: '&a已给予 &f{player} &7×&f{amount} &a个 &f{gem}'
# 调试开关
command-debug-on: '&a调试模式已临时开启, 输出范围: &f{scope} &7(重载后以 config.yml 为准)'
command-debug-off: '&7调试模式已临时关闭'
command-debug-scope: '&a调试输出范围已设为: &f{scope}'
command-debug-scope-all: '&a调试输出范围已设为: &f全部'
# 镶嵌台设置
command-no-air: '&c空气不能被设置为镶嵌台'
command-no-block: '&c准星处无方块...'
command-has-been-dug-up: '&e设置的镶嵌台方块已被挖掘, 后续在该位置放置的方块点击将不会打开镶嵌台'
command-block-not-allowed: '&c该方块不被允许设置为镶嵌台, 请联系管理员'
command-block-marbed: '&e该方块已被标记，正在覆盖...'

