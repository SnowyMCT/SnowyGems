# 本文件中的宝石全是符文台GUI里的按钮
# 一般情况下无需拿出来用

内置-符文碎片:
  Name: 符文碎片
  Display: "&8&l&k||&a&l符文碎片&8&l&k||"
  Tips:
    - "&7破碎符文留下的残片"
    - "&7可在&6符文合成台&7重铸"
  Require:
    - NOTHING
  Material: EMPTY_MAP
  Glow: true
  Rewards:
    - EMPTY

# (分解台按钮用)
内置-符文分解券:
  Name: 符文分解券
  Require:
    - LORE:符文等级
  Display: "&f符文分解券"
  Material: PAPER
  Glow: true
  Rewards:
    - Conditional{condition="$LORE:符文等级:$==1";roman=true;reward=ItemSet{Gem=符文碎片;Amount=10}}    $ignorable
    - Conditional{condition="$LORE:符文等级:$==2";roman=true;reward=ItemSet{Gem=符文碎片;Amount=20}}    $ignorable
    - Conditional{condition="$LORE:符文等级:$==3";roman=true;reward=ItemSet{Gem=符文碎片;Amount=50}}    $ignorable
    - Conditional{condition="$LORE:符文等级:$==4";roman=true;reward=ItemSet{Gem=符文碎片;Amount=200}}   $ignorable
    - Conditional{condition="$LORE:符文等级:$==5";roman=true;reward=ItemSet{Gem=符文碎片;Amount=800}}   $ignorable
  SuccessTip: "none"

