# ============================================================
#  新版本内容宝石示例  ModernGem.yml
# ============================================================
#  这个文件演示 1.20.5 → 26.x 期间 Mojang 新加的东西怎么写成宝石:
#    新属性(体型/交互距离/水下挖掘/重力…)、新附魔(密度/穿透/风爆)、
#    新药水效果(渗浆/盘丝/寄生/蓄风)、新物品(矛/铜装备/锤)
#
#     ️ 低版本服务端上, 这里的高版本条目会**自动跳过**并在控制台说明,
#     其余宝石照常工作 —— 不需要删掉本文件, 也不需要改配置
#     用 /sgem compat 查看当前服务端到底支持哪些
#
#  ── 宝石配置字段速查 ────────────────────────────────────
#    Name         宝石内部名(给玩家看的用 Display)
#    Type         不写=镶嵌类; PlayerGem=右键/饮用直接生效; RandomGem=开箱抽奖
#    Require      可镶嵌到哪些物品上(OR 语义, 命中任意一条即可)
#    Display      宝石物品的显示名
#    Tips         宝石物品的 lore
#    Texture      头颅 base64 材质(填了就强制用 PLAYER_HEAD)
#    Material     不用头颅时的物品材质
#    Color        皮革/药水的染色(配合 Material: POTION)
#    Glow         是否附魔光效
#    Eat          true 则需要"饮用/食用"而非右键
#    Success      成功率 1-100, 默认 100
#    Embed        占用镶嵌位权重, 0=不占位(非镶嵌类)
#    SuccessTip   成功提示; RemoveTip 拆卸提示; FailTip 失败提示
#    Rewards      真正干活的部分, 见下
#
#  ── Require 写法 ────────────────────────────────────────
#    WEAPON / TOOL / ARMOR / SWORD / PICKAXE / MACE / SPEAR / RANGED …
#                     分类关键字, 完整清单见 /sgem compat all
#    _SWORD           以 _SWORD 结尾的任意材质(石剑/铁剑/钻石剑…)
#    COPPER_*         以 COPPER_ 开头(整套铜装备)
#    DIAMOND_SWORD    精确物品名
#    LORE:文本        物品 lore 含指定文本
#    NOTHING          无条件通过
#
#  ── Rewards 可用函数 ────────────────────────────────────
#    Attribute{name=;operation=;slot=;var=;limit=}   属性加成(可叠加/可回退)
#    Enchant{name=;level=;limit=}                    附魔增删
#    LoreAdd{lore=;mode=;locator=;limit=;force=}     加一行 lore
#    LoreVar{lore=前缀;var=;format=;limit=;mode=}     加带数字的 lore(可叠加)
#    LoreReplace{old=;new=}                          替换 lore
#    Name{name=}                                     改物品名
#    Unbreakable / Durability{amount=}               无限耐久 / 修耐久
#    ItemFlag{HIDE_ENCHANTS}                         隐藏标记
#    Point{amount=} / Money{amount=}                 点券 / 金币
#    MaxHealth{amount=;limit=} / ExpLevel{amount=}   玩家永久生命 / 经验
#    Conditional{condition=;reward=;roman=}          条件奖励
#    Empty                                           占位(只靠 Tips 里的 BUFF 标记生效)
#
#  ── Rewards 标记 ────────────────────────────────────────
#    $onSuccess   仅镶嵌成功时执行(默认)
#    $onRemove    仅拆卸时执行(常用来收取拆卸费)
#      这一条失败不影响整次镶嵌
#
#  ── Attribute 的 operation ──────────────────────────────
#    0  直接加数值      (+1 生命)
#    1  按基础值百分比加 (+10% 移速)
#    2  按最终值百分比乘 (最后再 ×1.1)
#
#  ── Attribute 的 slot(1.20.5+ 才有槽位组语义) ───────────
#    head/chest/legs/feet   指定盔甲部位
#    hand/off_hand          主手/副手
#    any_hand               任意手持
#    armor                  任意盔甲位
#    any                    任意位置(放背包里也生效)
#    auto                   由插件按物品类型自动推断(推荐)
# ============================================================


# ════════════════════════════════════════════════════════════
#  一、新属性宝石 (1.20.5+ / 1.21.2+ / 26.x)
# ════════════════════════════════════════════════════════════

# ── scale 体型 (1.20.5+) ──────────────────────────────────
# 基础值 1.0这里每次 -0.1 让玩家变小, 最多缩到 0.7 倍
# 注意: var 是负数时 limit 也要写负数(limit 是"能加到的极限值")
缩小宝石:
  Name: 缩小宝石
  Require:
    - ARMOR
  Display: "&8&l&k||&d&l缩小宝石&8&l&k||"
  Tips:
    - "&d缩小宝石 &7品质: &b&l史诗"
    - "&7在 &b宝石镶嵌台 &7中镶嵌 &8(&f/sgem embed&8)"
    - "&7穿戴后体型缩小 &d10% &7(最多缩至 70%)"
    - "&8需要 1.20.5+ 服务端"
  Material: AMETHYST_SHARD
  Glow: true
  SuccessTip: "&f你使用了&d&l缩小宝石&f, 体型&d&l-10%"
  Rewards:
    - Attribute{name=scale;operation=0;slot=any;var=v-0.1;limit=-0.3}

放大宝石:
  Name: 放大宝石
  Require:
    - ARMOR
  Display: "&8&l&k||&5&l放大宝石&8&l&k||"
  Tips:
    - "&5放大宝石 &7品质: &b&l史诗"
    - "&7穿戴后体型增大 &510% &7(最多增至 150%)"
    - "&8需要 1.20.5+ 服务端"
  Material: AMETHYST_CLUSTER
  Glow: true
  SuccessTip: "&f你使用了&5&l放大宝石&f, 体型&5&l+10%"
  Rewards:
    - Attribute{name=scale;operation=0;slot=any;var=v+0.1;limit=0.5}

# ── block_interaction_range 方块交互距离 (1.20.5+) ────────
# 原版默认 4.5 格这颗宝石让你能放/挖更远的方块
延伸之瞳:
  Name: 延伸之瞳
  Require:
    - TOOL
    - PICKAXE
  Display: "&8&l&k||&b&l延伸之瞳&8&l&k||"
  Tips:
    - "&b延伸之瞳 &7品质: &a&l传说"
    - "&7镶嵌在工具上, 方块交互距离 &b+1 &7格"
    - "&7最多 &b+3 &7格"
    - "&8需要 1.20.5+ 服务端"
  Material: ENDER_EYE
  Glow: true
  SuccessTip: "&f你使用了&b&l延伸之瞳&f, 方块交互距离&b&l+1格"
  Rewards:
    - Attribute{name=block_interaction_range;operation=0;slot=hand;var=v+1;limit=3}

# ── entity_interaction_range 实体交互距离 (1.20.5+) ───────
# 也就是"攻击距离", 别名 attack_reach 同样可用
猎手之瞳:
  Name: 猎手之瞳
  Require:
    - WEAPON
    - MELEE
  Display: "&8&l&k||&c&l猎手之瞳&8&l&k||"
  Tips:
    - "&c猎手之瞳 &7品质: &a&l传说"
    - "&7镶嵌在近战武器上, 攻击距离 &c+0.5 &7格"
    - "&7最多 &c+2 &7格"
    - "&8需要 1.20.5+ 服务端"
  Material: SPIDER_EYE
  Glow: true
  SuccessTip: "&f你使用了&c&l猎手之瞳&f, 攻击距离&c&l+0.5格"
  Rewards:
    - Attribute{name=entity_interaction_range;operation=0;slot=hand;var=v+0.5;limit=2}

# ── submerged_mining_speed 水下挖掘速度 (1.21.2+) ─────────
# 原版水下挖掘速度是陆地的 1/5(值为 0.2)加到 1.0 就等于不受水影响,
# 效果类似"水下速掘"附魔但可叠加
深海矿工宝石:
  Name: 深海矿工宝石
  Require:
    - TOOL
  Display: "&8&l&k||&3&l深海矿工宝石&8&l&k||"
  Tips:
    - "&3深海矿工宝石 &7品质: &b&l史诗"
    - "&7水下挖掘速度 &3+20%"
    - "&7叠满后水下挖掘与陆地无异"
    - "&8需要 1.21.2+ 服务端"
  Material: PRISMARINE_SHARD
  Glow: true
  SuccessTip: "&f你使用了&3&l深海矿工宝石&f, 水下挖掘速度&3&l+20%"
  Rewards:
    - Attribute{name=submerged_mining_speed;operation=0;slot=hand;var=v+0.2;limit=0.8}

# ── mining_efficiency 挖掘效率 (1.21.2+) ──────────────────
# 与"效率"附魔叠加计算, 是纯数值加成
迅掘宝石:
  Name: 迅掘宝石
  Require:
    - TOOL
    - PICKAXE
    - AXE
    - SHOVEL
  Display: "&8&l&k||&e&l迅掘宝石&8&l&k||"
  Tips:
    - "&e迅掘宝石 &7品质: &f普通"
    - "&7挖掘效率 &e+1 &7(上限 +5)"
    - "&8需要 1.21.2+ 服务端"
  Material: GOLD_NUGGET
  SuccessTip: "&f你使用了&e&l迅掘宝石&f, 挖掘效率&e&l+1"
  Rewards:
    - Attribute{name=mining_efficiency;operation=0;slot=hand;var=v+1;limit=5}

# ── gravity 重力 (1.20.5+) ────────────────────────────────
# 默认 0.08调低后下落变慢、跳得更高, 像在月球上
月步靴石:
  Name: 月步靴石
  Require:
    - BOOTS
  Display: "&8&l&k||&f&l月步靴石&8&l&k||"
  Tips:
    - "&f月步靴石 &7品质: &b&l史诗"
    - "&7重力降低, 下落变慢跳跃更高"
    - "&8需要 1.20.5+ 服务端"
  Material: FEATHER
  Glow: true
  SuccessTip: "&f你使用了&f&l月步靴石&f, 重力&f&l-0.02"
  Rewards:
    - Attribute{name=gravity;operation=0;slot=feet;var=v-0.02;limit=-0.05}

# ── jump_strength 跳跃力 (1.20.5+ 玩家也可用) ─────────────
弹簧靴石:
  Name: 弹簧靴石
  Require:
    - BOOTS
  Display: "&8&l&k||&a&l弹簧靴石&8&l&k||"
