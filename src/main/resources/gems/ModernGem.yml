  Glow: true
  SuccessTip: "&f你使用了&a&l弹簧靴石&f, 跳跃力&a&l+10%"
  Rewards:
    - Attribute{name=jump_strength;operation=1;slot=feet;var=v+0.1;limit=0.5}

# ── safe_fall_distance 安全落地距离 (1.20.5+) ─────────────
