# ════════════════════════════════════════════════════════════
#  三、新药水效果 BUFF 宝石 (1.21+ 试炼密室)
# ════════════════════════════════════════════════════════════
#  BUFF 宝石的原理: 往装备 lore 里写一行标记, BUFF 引擎每秒扫描装备,
#  命中标记就施加对应效果
#
#  ⚠️ 两边必须配对:
#     这里的 LoreAdd{lore=...} 写什么, skills/ModernBuffs.yml 里对应定义的
#     Lore: 就必须写一样的文本, 否则镶嵌上了却没有任何效果
#  本文件的四颗宝石已在 skills/ModernBuffs.yml 里配好, 可直接用

渗浆药水:
  Name: 渗浆药水
  Embed: 1
  Require:
    - WEAPON
    - TOOL
    - ARMOR
  Display: "&8&l&k||&a&l渗浆药水&8&l&k||"
  Tips:
    - "&a&l渗浆药水 &7品质: &a&l传说"
    - "&7在 &b宝石镶嵌台 &7中镶嵌 &8(&f/sgem embed&8)"
    - "&7死亡时会生成史莱姆"
    - "&7可花费500点券拆卸"
    - "&8需要 1.21+ 服务端"
  Material: SLIME_BALL
  Glow: true
  SuccessTip: "&f你使用了&a&l渗浆药水&f, 装备添加&a&l渗浆&fBUFF"
  Rewards:
    - LoreAdd{lore=&6&l[&c&lBUFF&6&l] &b&l渗浆}
    - Point{amount=-500} $onRemove

盘丝药水:
  Name: 盘丝药水
  Embed: 1
  Require:
    - WEAPON
    - TOOL
    - ARMOR
  Display: "&8&l&k||&f&l盘丝药水&8&l&k||"
  Tips:
    - "&f&l盘丝药水 &7品质: &a&l传说"
    - "&7死亡时会生成蜘蛛网"
    - "&7可花费500点券拆卸"
    - "&8需要 1.21+ 服务端"
  Material: COBWEB
  Glow: true
  SuccessTip: "&f你使用了&f&l盘丝药水&f, 装备添加&f&l盘丝&fBUFF"
  Rewards:
    - LoreAdd{lore=&6&l[&c&lBUFF&6&l] &b&l盘丝}
    - Point{amount=-500} $onRemove

寄生药水:
  Name: 寄生药水
  Embed: 1
  Require:
    - WEAPON
    - TOOL
    - ARMOR
  Display: "&8&l&k||&7&l寄生药水&8&l&k||"
  Tips:
    - "&7&l寄生药水 &7品质: &a&l传说"
    - "&7受伤时会生成蠹虫"
    - "&7可花费500点券拆卸"
    - "&8需要 1.21+ 服务端"
