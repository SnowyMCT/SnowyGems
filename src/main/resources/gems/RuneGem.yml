# Ready-to-use examples for /sgem open 符文镶嵌台.
# Gui restricts these runes to that custom workbench; Require still checks equipment.
红色符文I:
  Name: 红色符文I
  Gui: [符文镶嵌台]
  Require: [WEAPON, TOOL]
  Display: '&c红色符文 I'
  Material: RED_DYE
  Glow: true
  Success: 100
  Tips:
    - '&7一级符文 · 红色符文'
    - '&7向物品添加 Lore 标记「强攻 I」；具体属性由其他插件读取'
    - '&7前往 /sgem open 符文镶嵌台'
