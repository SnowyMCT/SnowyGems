# Internal USE_GEM button recipe. The menu consumes the input only after a successful reward.
符文分解券:
  Name: 符文分解券
  Gui: [符文分解台]
  Require: ['LORE:一级符文']
  Display: '&6符文分解配方'
  Material: PAPER
  Success: 100
  SuccessTip: '&a已分解 1 颗一级符文，获得 10 个符文碎片'
  Rewards:
    - ItemGive{gem=符文碎片;amount=10}

# A material for server-specific shops or recipes. It has no direct-use rewards.
